ServerName localhost

# 1. Carga de módulos necesarios
LoadModule deflate_module /usr/local/apache2/modules/mod_deflate.so
LoadModule proxy_module /usr/local/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/local/apache2/modules/mod_proxy_http.so
LoadModule headers_module /usr/local/apache2/modules/mod_headers.so
LoadModule rewrite_module /usr/local/apache2/modules/mod_rewrite.so

<VirtualHost *:80>
    DocumentRoot /usr/local/apache2/htdocs/
    
    <Directory /usr/local/apache2/htdocs/>
        DirectoryIndex index.html
        # Seguridad: Desactivar listado de directorios y seguir enlaces simbólicos 
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 2. CABECERAS DE SEGURIDAD (Blue Team Focus) 
    # Establecer flags de seguridad en cookies (HttpOnly, Secure, SameSite)
    # Nota: El flag 'Secure' requiere que el tráfico final sea HTTPS
    Header edit Set-Cookie ^(.*)$ "$1;HttpOnly;Secure;SameSite=Strict"
    
    # Protección contra Clickjacking
    Header always append X-Frame-Options SAMEORIGIN
    
    # Protección contra XSS Reflejado en navegadores antiguos
    Header set X-XSS-Protection "1; mode=block"
    
    # Evitar que el navegador adivine el tipo de contenido (MIME Sniffing)
    Header set X-Content-Type-Options nosniff

    # 3. CONFIGURACIÓN DE PROXY (Docker Service Discovery) 
    # Redirección a la API de Python
    ProxyPass /api/ http://pythona4:8080/api/
    ProxyPassReverse /api/ http://pythona4:8080/api/

    # Traducción de rutas para archivos estáticos (evita errores 404 en fotos) 
    ProxyPass /archivos/ http://pythona4:8080/static/archivos/
    ProxyPassReverse /archivos/ http://pythona4:8080/static/archivos/
    
    # 4. GESTIÓN DE LOGS (Preparado para ELK/Elasticsearch) 
    LogFormat "%v %h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Forwarded-For}i\" %D" extended
    
    # Enviar logs a la salida estándar de Docker para monitorización en tiempo real 
    CustomLog /proc/self/fd/1 extended
    ErrorLog /proc/self/fd/2
    
    # LogLevel ajustado: 'info' o 'warn' para producción, 'trace8' solo para debugging intenso
    LogLevel info
</VirtualHost>
