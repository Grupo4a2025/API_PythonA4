<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>PESCADERÍA - Agregar Producto</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
    <link rel="stylesheet" href="estilos.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <script>
        // --- 1. PREVISUALIZACIÓN SEGURA ---
        function previsualizar() {
            const fileInput = document.getElementById("fichero");
            const preview = document.getElementById("img_preview");
            const nameDisplay = document.getElementById("filename-display");
            
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];

                // Validación de tamaño en cliente (5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert("⚠️ El archivo es demasiado grande (máx 5MB).");
                    fileInput.value = "";
                    return;
                }

                let reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    // ✅ SEGURIDAD XSS: Usamos textContent en lugar de innerHTML
                    nameDisplay.textContent = file.name;
                }
                reader.readAsDataURL(file);
            }
        }

        // --- 2. GUARDADO CON VALIDACIÓN ESTRICTA ---
        async function guardar(){
            const nombre = document.getElementById("nombre").value;
            const descripcion = document.getElementById("descripcion").value;
            const precio = document.getElementById("precio").value;
            const origen = document.getElementById("origen").value; 
            const fileInput = document.getElementById("fichero");

            // Validaciones de longitud (coincidentes con el backend)
            if(!nombre || nombre.length > 100 || !precio || isNaN(precio)) {
                alert("⚠️ Datos inválidos. El nombre (máx 100) y precio numérico son obligatorios.");
                return;
            }
            
            if(fileInput.files.length === 0) {
                alert("⚠️ Selecciona una foto (png, jpg, jpeg).");
                return;
            }

            try {
                // --- PASO A: SUBIDA SEGURA DE IMAGEN ---
                const file = fileInput.files[0];
                const nombreArchivo = file.name;
                
                let formData = new FormData();
                formData.append("fichero", file);
                formData.append("nombre", nombreArchivo);

                let resFichero = await fetch("/api/ficheros/", {
                    method: 'POST',
                    body: formData
                });
                
                let dataFichero = await resFichero.json();

                if(dataFichero.status !== "OK"){
                    throw new Error(dataFichero.mensaje || "Error al subir imagen");
                }

                // --- PASO B: GUARDADO PARAMETRIZADO EN BD ---
                const datosPescado = JSON.stringify({
                    "nombre": nombre,
                    "descripcion": descripcion,
                    "precio": parseFloat(precio),
                    "origen": origen,
                    "foto": dataFichero.filename // Usamos el nombre sanitizado por el servidor
                });

                let resBD = await fetch("/api/pescados/", {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: datosPescado
                });

                let dataBD = await resBD.json();

                if (dataBD.status == "OK"){
                    alert("✅ Producto registrado con éxito");
                    location.href = "pescados.html";
                } else {
                    alert("❌ Error: " + dataBD.mensaje);
                }

            } catch (error) {
                console.error('Error:', error);
                alert("⚠️ Error en el proceso: " + error.message);
            }
        }
    </script>
</head>
<body>
    <nav class="navbar is-info" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="pescados.html">
                <span class="icon is-medium mr-2"><i class="fas fa-fish"></i></span>
                <strong>MIPRIMERAPESCADERIA</strong>
            </a>
            <a role="button" class="navbar-burger" aria-label="menu" data-target="miMenu">
                <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            </a>
        </div>
        <div id="miMenu" class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="pescados.html">Listado</a>
                <a class="navbar-item is-active" href="agregar_pescado.html">Agregar</a>
                <a class="navbar-item" href="ficheros.html">Ficheros</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <a class="button is-light" href="index.html">Salir</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-half"> 
                    <div class="box p-5">
                        <h3 class="title is-3 has-text-centered mb-5">
                            <span class="icon has-text-info"><i class="fas fa-plus-circle"></i></span>
                            <span>Nuevo Producto</span>
                        </h3>
                        
                        <div class="field">
                            <label class="label">Nombre del Pescado</label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" placeholder="Ej: Merluza" id="nombre" maxlength="100">
                                <span class="icon is-small is-left"><i class="fas fa-tag"></i></span>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Descripción</label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" id="descripcion" maxlength="255">
                                <span class="icon is-small is-left"><i class="fas fa-align-left"></i></span>
                            </div>
                        </div>

                        <div class="columns">
                            <div class="column">
                                <div class="field">
                                    <label class="label">Precio (€/kg)</label>
                                    <div class="control has-icons-left">
                                        <input class="input" type="number" step="0.01" id="precio">
                                        <span class="icon is-small is-left"><i class="fas fa-euro-sign"></i></span>
                                    </div>
                                </div>
                            </div>
                            <div class="column">
                                <div class="field">
                                    <label class="label">Origen</label>
                                    <div class="control has-icons-left">
                                        <input class="input" type="text" id="origen" maxlength="100">
                                        <span class="icon is-small is-left"><i class="fas fa-globe-europe"></i></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="field mt-4">
                            <label class="label">Fotografía</label>
                            <div class="file has-name is-fullwidth is-info">
                                <label class="file-label">
                                    <input class="file-input" type="file" id="fichero" accept=".png,.jpg,.jpeg" onchange="previsualizar()">
                                    <span class="file-cta">
                                        <span class="file-icon"><i class="fas fa-upload"></i></span>
                                        <span class="file-label">Elegir foto...</span>
                                    </span>
                                    <span class="file-name" id="filename-display">Ningún archivo seleccionado</span>
                                </label>
                            </div>
                            <figure class="image is-128x128 mt-3" style="margin: 0 auto;">
                                <img id="img_preview" src="https://via.placeholder.com/128?text=Foto" class="is-rounded" style="object-fit: cover; height: 128px; width: 128px;">
                            </figure>
                        </div>

                        <div class="field is-grouped is-grouped-centered mt-6">
                            <div class="control">
                                <button type="button" onclick="guardar()" class="button is-success is-medium">
                                    <span class="icon"><i class="fas fa-save"></i></span>
                                    <span>Guardar</span>
                                </button>
                            </div>
                        </div>
                    </div> 
                </div>
            </div>
        </div>
    </section>
</body>
</html>
