<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>PESCADERÍA - Acceso</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
    <link rel="stylesheet" href="estilos.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        .login-section {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1; 
            padding-top: 3rem;
            padding-bottom: 3rem;
        }
        /* Animación de error simple */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }
    </style>

    <script>
        // --- LÓGICA DE AUTENTICACIÓN SEGURA ---
        async function conectar() {
            const errorMsg = document.getElementById("mensajeError");
            const userField = document.getElementById("username");
            const passField = document.getElementById("password");
            
            errorMsg.style.display = "none";
            errorMsg.classList.remove("animate-shake");

            const username = userField.value.trim();
            const password = passField.value.trim();

            // Validación previa en cliente
            if (!username || !password || username.length > 50 || password.length > 50) {
                errorMsg.style.display = "block";
                errorMsg.classList.add("animate-shake");
                return;
            }

            try {
                const response = await fetch("/api/usuarios/login", {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ "username": username, "password": password })
                });

                const result = await response.json();

                if (result.status === "OK") {
                    // Redirección al listado principal protegido
                    location.href = "pescados.html";
                } else {
                    errorMsg.style.display = "block";
                    errorMsg.classList.add("animate-shake");
                    // Limpiamos la password por seguridad tras fallo
                    passField.value = "";
                }
            } catch (error) {
                console.error('Error de red:', error);
                alert("⚠️ No se pudo contactar con el servicio de autenticación.");
            }
        }
        
        // Manejo de eventos de teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') conectar();
        });
    </script>
</head>

<body>
    <nav class="navbar is-info">
        <div class="navbar-brand">
            <a class="navbar-item" href="#">
                <span class="icon is-medium mr-2"><i class="fas fa-fish"></i></span>
                <strong>MIPRIMERAPESCADERIA</strong>
            </a>
        </div>
    </nav>

    <section class="section login-section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-4-desktop is-5-tablet">
                    
                    <div class="box p-5">
                        <div class="has-text-centered mb-5">
                            <span class="icon is-large has-text-info mb-2">
                                <i class="fas fa-user-circle fa-3x"></i>
                            </span>
                            <h3 class="title is-4">Panel de Control</h3>
                            <p class="subtitle is-6 has-text-grey">Introduce tus credenciales</p>
                        </div>

                        <form onsubmit="return false;">
                            <div class="field">
                                <label class="label">Usuario</label>
                                <div class="control has-icons-left">
                                    <input type="text" placeholder="Tu usuario" class="input" id="username" maxlength="50" required autofocus>
                                    <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Contraseña</label>
                                <div class="control has-icons-left">
                                    <input type="password" placeholder="*******" class="input" id="password" maxlength="50" required>
                                    <span class="icon is-small is-left"><i class="fas fa-lock"></i></span>
                                </div>
                            </div>

                            <div id="mensajeError" class="notification is-danger is-light mb-4 is-size-7" style="display: none;">
                                <span class="icon"><i class="fas fa-exclamation-triangle"></i></span>
                                <strong>Acceso denegado:</strong> Credenciales no válidas.
                            </div>

                            <div class="field mt-5">
                                <button type="button" onclick="conectar()" class="button is-success is-fullwidth is-medium">
                                    <strong>Iniciar Sesión</strong>
                                </button>
                            </div>
                            
                            <hr class="my-4">

                            <div class="has-text-centered">
                                <p class="is-size-7 mb-2">Gestión de personal e inventario</p>
                                <a href="registro.html" class="button is-small is-ghost">Crear nueva cuenta</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="content has-text-centered">
            <p><strong>MiPrimeraPescadería</strong> &copy; 2026 - Control de Calidad y Seguridad</p>
        </div>
    </footer>
</body>
</html>
