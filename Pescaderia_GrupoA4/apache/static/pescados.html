<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>PESCADERÍA - Listado de Productos</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
    <link rel="stylesheet" href="estilos.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        .table-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 1rem;
            overflow-x: auto;
        }
        .font-numeric {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .fish-thumb {
            height: 48px;
            width: 48px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #eee;
        }
    </style>

    <script>
        // --- 1. CARGA INICIAL ---
        window.onload = () => pedirPescados();

        // --- 2. RENDERIZADO SEGURO (Anti-XSS) ---
        function pintarPescados(lista){
            const tbody = document.querySelector("tbody");
            tbody.innerHTML = "";

            if(lista.length === 0){
                tbody.innerHTML = '<tr><td colspan="8" class="has-text-centered p-5">Inventario vacío.</td></tr>';
                return;
            }

            lista.forEach(pescado => {
                const row = tbody.insertRow();
                
                // Celda Foto
                const cellFoto = row.insertCell();
                cellFoto.className = "is-vcentered has-text-centered";
                const rutaFoto = (pescado.foto && pescado.foto.startsWith('http')) 
                    ? pescado.foto 
                    : `/archivos/${encodeURIComponent(pescado.foto || 'placeholder.png')}`;
                cellFoto.innerHTML = `<img src="${rutaFoto}" class="fish-thumb" onerror="this.src='https://via.placeholder.com/50?text=Fish'">`;

                // Celda Nombre
                const cellNombre = row.insertCell();
                cellNombre.className = "is-vcentered has-text-weight-bold has-text-info";
                cellNombre.textContent = pescado.nombre; // ✅ SEGURIDAD: Texto plano

                // Celda Descripción
                const cellDesc = row.insertCell();
                cellDesc.className = "is-vcentered is-size-7";
                cellDesc.style.maxWidth = "200px";
                cellDesc.textContent = pescado.descripcion;

                // Celda Origen
                const cellOrigen = row.insertCell();
                cellOrigen.className = "is-vcentered";
                const tag = document.createElement("span");
                tag.className = "tag is-light is-info is-rounded";
                tag.textContent = pescado.origen;
                cellOrigen.appendChild(tag);

                // Precios e IVA
                const precioBase = parseFloat(pescado.precio || 0);
                const valorIVA = parseFloat(pescado.iva || 0);
                const precioTotal = (precioBase + valorIVA).toFixed(2);

                const cellPrecioBase = row.insertCell();
                cellPrecioBase.className = "is-vcentered has-text-right font-numeric";
                cellPrecioBase.textContent = `${precioBase.toFixed(2)} €`;

                const cellPrecioTotal = row.insertCell();
                cellPrecioTotal.className = "is-vcentered has-text-right has-text-success font-numeric";
                cellPrecioTotal.innerHTML = `<span class="is-size-5">${precioTotal} €</span><br><span class="is-size-7 has-text-grey-light">(IVA: ${valorIVA.toFixed(2)}€)</span>`;

                // Botones de Acción
                const cellEdit = row.insertCell();
                cellEdit.className = "is-vcentered has-text-centered";
                cellEdit.innerHTML = `<a href="editar_pescado.html?id=${pescado.id}" class="button is-small is-primary is-outlined"><i class="fas fa-edit"></i></a>`;

                const cellDelete = row.insertCell();
                cellDelete.className = "is-vcentered has-text-centered";
                const btnDel = document.createElement("button");
                btnDel.className = "button is-small is-danger is-outlined";
                btnDel.innerHTML = '<i class="fas fa-trash-alt"></i>';
                btnDel.onclick = () => eliminarPescado(pescado.id);
                cellDelete.appendChild(btnDel);
            });
        }

        // --- 3. COMUNICACIÓN CON API ---
        async function pedirPescados(){
            try {
                const response = await fetch("/api/pescados/");
                const result = await response.json();
                if(Array.isArray(result)) pintarPescados(result);
            } catch (error) {
                console.error("Error al obtener datos:", error);
            }
        }

        async function eliminarPescado(id){
            if(!confirm("⚠️ ¿Eliminar este producto permanentemente?")) return;

            try {
                const response = await fetch(`/api/pescados/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.status === "OK") pedirPescados();
            } catch (error) {
                alert("⚠️ Error de conexión.");
            }
        }

        async function cerrarSesion(){
            await fetch("/api/usuarios/logout");
            location.href = "index.html";
        }
    </script>
</head>
<body>
    <nav class="navbar is-info">
        <div class="navbar-brand">
            <a class="navbar-item" href="pescados.html">
                <span class="icon is-medium mr-2"><i class="fas fa-fish"></i></span>
                <strong>MIPRIMERAPESCADERIA</strong>
            </a>
            <a role="button" class="navbar-burger" data-target="miMenu">
                <span></span><span></span><span></span>
            </a>
        </div>
        <div id="miMenu" class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item is-active" href="pescados.html">Listado</a>
                <a class="navbar-item" href="agregar_pescado.html">Agregar</a>
                <a class="navbar-item" href="ficheros.html">Ficheros</a>
                <a class="navbar-item" href="comentarios.html">Reseñas</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <button class="button is-danger is-light is-small" onclick="cerrarSesion()">
                        <span class="icon"><i class="fas fa-sign-out-alt"></i></span>
                        <span>Salir</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <div class="level mb-6">
                <div class="level-left">
                    <h1 class="title is-3 has-text-info">Inventario de Productos</h1>
                </div>
                <div class="level-right">
                    <a href="agregar_pescado.html" class="button is-success is-medium">
                        <span class="icon"><i class="fas fa-plus-circle"></i></span>
                        <span>Nuevo Pescado</span>
                    </a>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="table is-striped is-hoverable is-fullwidth">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Origen</th>
                            <th class="has-text-right">Base</th>
                            <th class="has-text-right">PVP</th>
                            <th colspan="2" class="has-text-centered">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="8" class="has-text-centered p-5">Cargando catálogo...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <script>
        // Lógica del burger menu
        document.querySelector('.navbar-burger').addEventListener('click', function() {
            this.classList.toggle('is-active');
            document.getElementById(this.dataset.target).classList.toggle('is-active');
        });
    </script>
</body>
</html>
