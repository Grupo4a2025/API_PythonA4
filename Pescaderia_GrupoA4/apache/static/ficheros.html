<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PESCADERÍA - Gestión de Ficheros</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
    <link rel="stylesheet" href="estilos.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    
    <script>
        // --- 1. LÓGICA DE SUBIDA CON VALIDACIÓN PREVIA ---
        async function enviarArchivo(){
            const fileInput = document.getElementById("fichero");
            const nombreInput = document.getElementById("nombre");
            
            if(fileInput.files.length === 0){
                alert("⚠️ Por favor, selecciona un archivo.");
                return;
            }

            const file = fileInput.files[0];
            
            // Validación de seguridad en cliente (máx 5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert("⚠️ Error: El archivo supera el límite de 5MB.");
                return;
            }

            const nombreGuardar = nombreInput.value.trim() || file.name;
            const formData = new FormData();
            formData.append('fichero', file);
            formData.append('nombre', nombreGuardar);
            
            try {
                const response = await fetch("/api/ficheros/", {method: 'POST', body: formData});
                const result = await response.json();
                
                if (result.status == "OK"){
                    alert("✅ Archivo subido y sanitizado: " + result.filename);
                    nombreInput.value = "";
                    fileInput.value = "";
                    document.getElementById('filename-display').textContent = "Sin archivo";
                } else {
                    alert("❌ Error: " + (result.mensaje || "Formato no permitido"));
                }
            } catch (error) {
                console.error(error);
                alert("⚠️ Error de conexión con el servidor.");
            }
        }

        // --- 2. LÓGICA DE VISUALIZACIÓN SEGURA ---
        function visualizarArchivo(){
            const nombre = document.getElementById("nombreArchivo").value.trim();
            const visor = document.getElementById("visorContenido");
            const linkPrueba = document.getElementById("linkPrueba");
            
            if(!nombre){
                alert("Escribe el nombre del archivo.");
                return;
            }

            // Codificamos el componente de la URI para evitar problemas con espacios o caracteres especiales
            const ruta = "/archivos/" + encodeURIComponent(nombre);
            
            linkPrueba.href = ruta;
            linkPrueba.textContent = `Abrir ${nombre} en pestaña nueva`;
            linkPrueba.style.display = "inline-block";

            const extension = nombre.split('.').pop().toLowerCase();
            visor.innerHTML = ""; // Limpieza previa

            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(extension)) {
                const img = document.createElement("img");
                img.src = ruta;
                img.style.maxHeight = "500px";
                img.style.borderRadius = "8px";
                img.alt = "Vista previa";
                visor.appendChild(img);
            } else if (extension === 'pdf') {
                const embed = document.createElement("embed");
                embed.src = ruta;
                embed.type = "application/pdf";
                embed.width = "100%";
                embed.height = "600px";
                visor.appendChild(embed);
            } else {
                visor.textContent = "La previsualización no está disponible para este tipo de archivo, pero puedes usar el enlace de arriba.";
            }
        }
    </script>
</head>
<body>
    <nav class="navbar is-info">
        <div class="navbar-brand">
            <a class="navbar-item" href="pescados.html">
                <span class="icon mr-2"><i class="fas fa-fish"></i></span>
                <strong>MIPRIMERAPESCADERIA</strong>
            </a>
        </div>
        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="pescados.html">Listado</a>
                <a class="navbar-item" href="agregar_pescado.html">Nuevo</a>
                <a class="navbar-item is-active" href="ficheros.html">Ficheros</a>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="title is-3 has-text-centered mb-6">Gestión Segura de Documentos</h1>
            
            <div class="columns is-variable is-8">
                <div class="column is-one-third">
                    <div class="box has-background-light">
                        <h2 class="title is-4 has-text-info"><i class="fas fa-upload mr-2"></i>Subir</h2>
                        <div class="field">
                            <label class="label">Nombre (opcional)</label>
                            <input class="input" type="text" placeholder="ej: foto_merluza.jpg" id="nombre">
                        </div>
                        <div class="field">
                            <div class="file has-name is-fullwidth is-info">
                                <label class="file-label">
                                    <input class="file-input" type="file" id="fichero" accept=".png,.jpg,.jpeg,.pdf" 
                                           onchange="document.getElementById('filename-display').textContent = this.files[0].name;">
                                    <span class="file-cta">
                                        <span class="file-icon"><i class="fas fa-search"></i></span>
                                        <span class="file-label">Buscar...</span>
                                    </span>
                                    <span class="file-name" id="filename-display">Sin archivo</span>
                                </label>
                            </div>
                        </div>
                        <button onclick="enviarArchivo()" class="button is-success is-fullwidth mt-4">Enviar</button>
                    </div>
                </div>

                <div class="column">
                    <div class="box">
                        <h2 class="title is-4 has-text-info"><i class="fas fa-eye mr-2"></i>Visor</h2>
                        <div class="field has-addons">
                            <div class="control is-expanded">
                                <input class="input" type="text" placeholder="nombre_archivo.jpg" id="nombreArchivo">
                            </div>
                            <div class="control">
                                <button onclick="visualizarArchivo()" class="button is-info">Ver</button>
                            </div>
                        </div>
                        <div class="has-text-centered mb-4">
                            <a id="linkPrueba" href="#" target="_blank" class="button is-ghost is-small" style="display:none;"></a>
                        </div>
                        <div id="visorContenido" class="has-text-centered p-5" style="min-height: 300px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
                            <p class="has-text-grey-light">Esperando archivo...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
