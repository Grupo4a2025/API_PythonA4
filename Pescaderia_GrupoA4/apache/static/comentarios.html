<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>PESCADERÍA - Opiniones</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        .table-container {
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            background: white;
            padding: 1rem;
        }
        .user-cell {
            font-weight: 600;
            color: #3273dc;
            width: 25%;
        }
    </style>

    <script>
        // Cargar comentarios al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            pedirComentarios();
        });

        // --- 1. GUARDADO CON VALIDACIÓN ESTRICTA (Client-Side) ---
        async function guardarComentario() {
            const usuarioInput = document.getElementById("usuario");
            const descripcionInput = document.getElementById("descripcion");
            const usuario = usuarioInput.value.trim();
            const descripcion = descripcionInput.value.trim();

            // Validación de longitudes coincidentes con el backend
            if(!usuario || usuario.length > 50 || !descripcion || descripcion.length > 500){
                alert("⚠️ Por favor, rellena los campos correctamente (Nombre máx. 50, Opinión máx. 500 caracteres).");
                return;
            }

            const raw = JSON.stringify({
                "usuario": usuario,
                "descripcion": descripcion
            });

            try {
                const response = await fetch("/api/comentarios/", {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: raw
                });
                
                const result = await response.json();

                if (result.status == "OK"){
                    alert("✅ Comentario publicado con éxito");
                    usuarioInput.value = "";
                    descripcionInput.value = "";
                    pedirComentarios();
                } else {
                    alert("❌ Error: " + (result.mensaje || "No se pudo guardar"));
                }
            } catch (error) {
                console.error('Error:', error);
                alert("⚠️ Error de conexión con el servidor.");
            }
        }

        // --- 2. RENDERIZADO SEGURO (Anti-XSS) ---
        function pintarComentarios(lista){
            const tbody = document.querySelector("tbody");
            tbody.innerHTML = ""; // Limpiamos el contenedor

            if(lista.length === 0){
                const row = tbody.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 2;
                cell.className = "has-text-centered has-text-grey p-5";
                cell.textContent = "No hay comentarios aún. ¡Sé el primero!";
                return;
            }

            lista.forEach(comentario => {
                const row = tbody.insertRow();
                
                // Celda de Usuario
                const cellUser = row.insertCell();
                cellUser.className = "user-cell";
                // Insertamos el icono de forma estática
                cellUser.innerHTML = '<span class="icon is-small mr-1"><i class="fas fa-user-circle"></i></span>';
                // ✅ SEGURIDAD: El nombre del usuario se inserta como texto plano
                const userName = document.createElement("span");
                userName.textContent = comentario.usuario;
                cellUser.appendChild(userName);

                // Celda de Descripción
                const cellDesc = row.insertCell();
                const descSpan = document.createElement("span");
                descSpan.className = "has-text-grey-dark";
                // ✅ SEGURIDAD: La opinión se inserta como texto plano
                descSpan.textContent = comentario.descripcion;
                cellDesc.appendChild(descSpan);
            });
        }

        async function pedirComentarios(){
            try {
                const response = await fetch("/api/comentarios/");
                const result = await response.json();
                if (result) {
                    pintarComentarios(result);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</head>
<body>
    <nav class="navbar is-info" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="pescados.html">
                <span class="icon is-medium mr-2"><i class="fas fa-fish"></i></span>
                <strong>MIPRIMERAPESCADERIA</strong>
            </a>
            <a role="button" class="navbar-burger" aria-label="menu" data-target="miMenu">
                <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            </a>
        </div>

        <div id="miMenu" class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="pescados.html">Listado</a>
                <a class="navbar-item is-active" href="comentarios.html">Opiniones</a>
                <a class="navbar-item" href="ficheros.html">Ficheros</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <a class="button is-light" href="index.html">Salir</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="title is-3 has-text-centered mb-6">Opiniones de nuestros clientes</h1>

            <div class="columns is-variable is-8">
                <div class="column is-one-third">
                    <div class="box has-background-light" style="position: sticky; top: 20px;">
                        <h2 class="title is-4 has-text-info">
                            <span class="icon"><i class="fas fa-pen-nib"></i></span>
                            Deja tu reseña
                        </h2>
                        
                        <div class="field">
                            <label class="label">Tu Nombre</label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" id="usuario" placeholder="Ej: Juan Pérez" maxlength="50">
                                <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Tu Opinión</label>
                            <div class="control">
                                <textarea class="textarea" id="descripcion" placeholder="¿Qué te ha parecido?" rows="4" maxlength="500"></textarea>
                            </div>
                        </div>

                        <div class="control mt-5">
                            <button type="button" onclick="guardarComentario()" class="button is-success is-fullwidth">
                                <span class="icon"><i class="fas fa-paper-plane"></i></span>
                                <span>Publicar</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="column">
                    <div class="table-container">
                        <table class="table is-striped is-hoverable is-fullwidth">
                            <thead>
                                <tr>
                                    <th class="has-text-info">Cliente</th>
                                    <th class="has-text-info">Opinión</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="2" class="has-text-centered p-5">
                                        <span class="icon is-large"><i class="fas fa-spinner fa-pulse"></i></span> Cargando...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>  
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
            $navbarBurgers.forEach( el => {
                el.addEventListener('click', () => {
                    const target = el.dataset.target;
                    const $target = document.getElementById(target);
                    el.classList.toggle('is-active');
                    $target.classList.toggle('is-active');
                });
            });
        });
    </script>
</body>
</html>
