<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>PESCADERÍA - Editar Producto</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idPescado = urlParams.get('id');

        window.onload = () => {
            if(!idPescado){
                alert("⚠️ No se ha especificado un ID de producto.");
                location.href = "pescados.html";
                return;
            }
            obtenerDatosPescado(idPescado);
        }

        // --- 1. RECUPERACIÓN DE DATOS ---
        async function obtenerDatosPescado(id) {
            try {
                const response = await fetch(`/api/pescados/${id}`);
                if (!response.ok) throw new Error("Producto no encontrado");
                
                const pescado = await response.json();
                pintarPescado(pescado);
            } catch (error) {
                console.error('Error:', error);
                alert("⚠️ Error al recuperar los datos del pescado.");
                location.href = "pescados.html";
            }
        }

        function pintarPescado(pescado) {
            document.getElementById("nombre").value = pescado.nombre || "";
            document.getElementById("descripcion").value = pescado.descripcion || "";
            document.getElementById("precio").value = pescado.precio || 0;
            document.getElementById("foto").value = pescado.foto || "";
            document.getElementById("origen").value = pescado.origen || "";

            // La ruta /archivos/ es gestionada por el proxy de Apache
            if(pescado.foto){
                actualizarPreview();
            }
        }

        function actualizarPreview(){
            const nombreFoto = document.getElementById("foto").value.trim();
            const imgPreview = document.getElementById("img_preview");
            if(nombreFoto){
                // Sanitizamos visualmente la ruta para el cliente
                imgPreview.src = `/archivos/${encodeURIComponent(nombreFoto)}`;
                imgPreview.style.display = "block";
            } else {
                imgPreview.style.display = "none";
            }
        }

        // --- 2. ACTUALIZACIÓN CON VALIDACIÓN ---
        async function guardar() {
            const nombre = document.getElementById("nombre").value.trim();
            const descripcion = document.getElementById("descripcion").value.trim();
            const precio = document.getElementById("precio").value;
            const foto = document.getElementById("foto").value.trim();
            const origen = document.getElementById("origen").value.trim();

            // Validación estricta antes de enviar a la API
            if(!nombre || nombre.length > 100 || isNaN(precio) || !foto) {
                alert("⚠️ Por favor, revisa los campos. El nombre (máx 100) y la foto son obligatorios.");
                return;
            }

            const datos = JSON.stringify({
                "id": idPescado,
                "nombre": nombre,
                "descripcion": descripcion,
                "precio": parseFloat(precio),
                "foto": foto,
                "origen": origen
            });

            try {
                const response = await fetch("/api/pescados/", {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json" },
                    body: datos
                });

                const result = await response.json();

                if (result.status === "OK") {
                    alert("✅ Pescado modificado correctamente");
                    location.href = "pescados.html";
                } else {
                    alert(`❌ Error: ${result.mensaje || "No se pudo modificar"}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert("⚠️ Error de conexión con el servidor.");
            }
        }
    </script>
</head>

<body>
    <nav class="navbar is-info" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="pescados.html">
                <span class="icon is-medium mr-2"><i class="fas fa-fish"></i></span>
                <strong>MIPRIMERAPESCADERIA</strong>
            </a>
            <a role="button" class="navbar-burger" aria-label="menu" data-target="miMenu">
                <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            </a>
        </div>

        <div id="miMenu" class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="pescados.html">Listado</a>
                <a class="navbar-item" href="agregar_pescado.html">Agregar</a>
                <a class="navbar-item" href="ficheros.html">Ficheros</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <a class="button is-light" href="index.html">Salir</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-half">
                    <div class="box p-5">
                        <h3 class="title is-3 has-text-centered mb-5">
                            <span class="icon has-text-info"><i class="fas fa-edit"></i></span>
                            <span>Editar Producto</span>
                        </h3>
                        
                        <div class="field">
                            <label class="label">Nombre</label>
                            <div class="control has-icons-left">
                                <input required type="text" class="input" id="nombre" maxlength="100">
                                <span class="icon is-small is-left"><i class="fas fa-tag"></i></span>
                            </div>
                        </div>
                        
                        <div class="field">
                            <label class="label">Descripción</label>
                            <div class="control has-icons-left">
                                <input required type="text" class="input" id="descripcion">
                                <span class="icon is-small is-left"><i class="fas fa-align-left"></i></span>
                            </div>
                        </div>
                        
                        <div class="columns">
                            <div class="column">
                                <div class="field">
                                    <label class="label">Precio (€/kg)</label>
                                    <div class="control has-icons-left">
                                        <input required type="number" step="0.01" class="input" id="precio">
                                        <span class="icon is-small is-left"><i class="fas fa-euro-sign"></i></span>
                                    </div>
                                </div>
                            </div>
                            <div class="column">
                                <div class="field">
                                    <label class="label">Origen</label>
                                    <div class="control has-icons-left">
                                        <input required type="text" class="input" id="origen">
                                        <span class="icon is-small is-left"><i class="fas fa-globe-europe"></i></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Nombre del Archivo (Foto)</label>
                            <div class="control has-icons-left">
                                <input required type="text" class="input" id="foto" oninput="actualizarPreview()">
                                <span class="icon is-small is-left"><i class="fas fa-image"></i></span>
                            </div>
                            <p class="help">Debe coincidir con un archivo subido en la sección de gestión.</p>
                        </div>

                        <div class="has-text-centered mb-4 p-3" style="background: #f9f9f9; border-radius: 8px;">
                            <label class="label is-small has-text-grey">Vista previa</label>
                            <img src="" alt="Previsualización" id="img_preview" style="max-height: 180px; border-radius: 6px; display: none; margin: 0 auto;">
                        </div>

                        <div class="field is-grouped is-grouped-centered mt-5">
                            <div class="control">
                                <button type="button" onclick="guardar()" class="button is-success is-medium">
                                    <span class="icon"><i class="fas fa-save"></i></span>
                                    <span>Guardar Cambios</span>
                                </button>
                            </div>
                            <div class="control">
                                <a href="pescados.html" class="button is-light is-medium">Cancelar</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="content has-text-centered">
            <p><strong>MiPrimeraPescadería</strong> &copy; 2026</p>
        </div>
    </footer>

    <script>
        // Lógica del burger menu para Bulma
        document.querySelector('.navbar-burger').addEventListener('click', function() {
            this.classList.toggle('is-active');
            document.getElementById(this.dataset.target).classList.toggle('is-active');
        });
    </script>
</body>
</html>
